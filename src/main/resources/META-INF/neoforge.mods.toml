license="${mod_license}"
issueTrackerURL="https://github.com/DrakesCraft-Labs/TinkersConstruct/issues"
logoFile="logo.png"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="SlimeKnights; DrakesCraft port contributors"
description='''
An unofficial, work-in-progress port of Tinkers' Construct for Minecraft 1.21.11.
This development branch is not a playable or release-ready build.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="mantle"
type="required"
# Fail closed until a matching 1.21.11 Mantle build is available and validated.
versionRange="[99.0.0,)"
ordering="AFTER"
side="BOTH"
